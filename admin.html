<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Administración</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin">

  <header class="barra">
    <div class="contenedor barra-fila">
      <h1>La Esquina, administración</h1>
      <a href="index.html">Ver la web</a>
    </div>
  </header>

  <main class="contenedor">

    <!-- Inicio de sesión -->
    <section id="login">
      <h2>Entrar</h2>
      <form id="form-login" class="formulario estrecho">
        <div class="campo">
          <label for="email">Correo</label>
          <input id="email" type="email" required autocomplete="username">
        </div>
        <div class="campo">
          <label for="clave">Contraseña</label>
          <input id="clave" type="password" required autocomplete="current-password">
        </div>
        <div class="campo">
          <button class="boton" type="submit">Entrar</button>
        </div>
        <p id="login-msg" class="mensaje" role="status"></p>
      </form>
    </section>

    <!-- Panel -->
    <div id="panel" hidden>
      <div class="tabs-fila">
        <div class="tabs" role="tablist">
          <button role="tab" data-tab="reservas" aria-selected="true">Reservas</button>
          <button role="tab" data-tab="platos" aria-selected="false">Platos</button>
        </div>
        <button id="salir" class="boton boton-sec chico" type="button">Salir</button>
      </div>

      <!-- Reservas -->
      <section id="tab-reservas">
        <div class="titulo-fila">
          <h2>Reservas</h2>
          <label class="check"><input type="checkbox" id="pasadas"> Incluir reservas pasadas</label>
        </div>
        <p id="reservas-msg" class="mensaje" role="status"></p>
        <p id="reservas-vacio" class="vacio" hidden>No hay reservas todavía.</p>
        <div class="tabla-wrap">
          <table>
            <thead>
              <tr>
                <th>Fecha</th><th>Hora</th><th>Nombre</th><th>Teléfono</th>
                <th>Personas</th><th>Notas</th><th>Estado</th><th></th>
              </tr>
            </thead>
            <tbody id="reservas-cuerpo"></tbody>
          </table>
        </div>
      </section>

      <!-- Platos -->
      <section id="tab-platos" hidden>
        <h2>Platos</h2>

        <form id="form-plato" class="formulario tres">
          <input type="hidden" id="plato-id">
          <div class="campo">
            <label for="p-nombre">Nombre</label>
            <input id="p-nombre" required maxlength="100">
          </div>
          <div class="campo">
            <label for="p-categoria">Categoría</label>
            <input id="p-categoria" required maxlength="50" list="categorias-lista">
            <datalist id="categorias-lista"></datalist>
          </div>
          <div class="campo">
            <label for="p-precio">Precio ($)</label>
            <input id="p-precio" type="number" step="0.01" min="0" required inputmode="decimal">
          </div>
          <div class="campo ancho">
            <label for="p-descripcion">Descripción (opcional)</label>
            <textarea id="p-descripcion" rows="2" maxlength="300"></textarea>
          </div>
          <div class="campo ancho fila-botones">
            <button id="guardar-plato" class="boton" type="submit">Agregar plato</button>
            <button id="cancelar-plato" class="boton boton-sec" type="button" hidden>Cancelar</button>
          </div>
          <p id="platos-msg" class="mensaje" role="status"></p>
        </form>

        <div class="tabla-wrap">
          <table>
            <thead>
              <tr><th>Plato</th><th>Categoría</th><th>Precio</th><th>Estado</th><th></th></tr>
            </thead>
            <tbody id="platos-cuerpo"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
